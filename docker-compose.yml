services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: customers_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"        # optional: only needed to connect from your PC (e.g. pgAdmin)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d customers_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network
  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "8001:8001"
    networks:
      - ecommerce-network

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8002:8002"
    environment:
      - PRODUCT_SERVICE_URL=http://product-service:8001
      - CUSTOMER_SERVICE_URL=http://customer-service:8003
    depends_on:
      - product-service
      - customer-service
    networks:
      - ecommerce-network
    
  customer-service:
    build: ./customer-service
    container_name: customer-service
    ports:
      - "8003:8003"
    networks:
      - ecommerce-network
    environment:
      - DATABASE_URL=postgresql://appuser:apppassword@postgres:5432/customers_db
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
networks:
  ecommerce-network:
    driver: bridge